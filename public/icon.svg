<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tile" x1="40" y1="0" x2="480" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101A2E"/>
      <stop offset="55%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="blue" x1="70" y1="160" x2="280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="pink" x1="240" y1="80" x2="450" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="ring" x1="120" y1="80" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <circle cx="118" cy="120" r="110" fill="#3B82F6" opacity="0.22"/>
  <circle cx="400" cy="130" r="100" fill="#EC4899" opacity="0.2"/>
  <circle cx="256" cy="420" r="120" fill="#38BDF8" opacity="0.08"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#ring)" stroke-width="3"/>

  <!-- Pink bubble (back) -->
  <g filter="url(#shadow)">
    <path fill="url(#pink)" d="
      M214 108
      h152
      c42 0 76 34 76 76
      v58
      c0 42-34 76-76 76
      h-28
      l-38 44
      c-5 6-14 2-14-6
      V318
      H214
      c-42 0-76-34-76-76
      v-58
      c0-42 34-76 76-76z"/>
  </g>

  <!-- Blue bubble (front) -->
  <g filter="url(#shadow)">
    <path fill="url(#blue)" d="
      M110 210
      h168
      c42 0 76 34 76 76
      v58
      c0 42-34 76-76 76
      H176
      v38
      c0 8-9 12-14 6
      l-44-50
      H110
      c-42 0-76-34-76-76
      v-58
      c0-42 34-76 76-76z"/>
  </g>

  <!-- Highlight sheen on blue -->
  <path fill="#fff" opacity="0.16" d="
    M110 210
    h168
    c42 0 76 34 76 76
    v10
    c-30-36-82-54-152-54
    H110
    c-20 0-38 6-52 16
    V286
    c0-42 34-76 76-76z"/>

  <!-- Typing dots -->
  <g fill="#fff" filter="url(#glow)">
    <circle cx="156" cy="292" r="16"/>
    <circle cx="204" cy="292" r="16"/>
    <circle cx="252" cy="292" r="16"/>
  </g>

  <!-- Translation mark: small dual arrow badge -->
  <g filter="url(#glow)">
    <circle cx="340" cy="236" r="36" fill="#0B1220" opacity="0.55"/>
    <circle cx="340" cy="236" r="36" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="3"/>
    <path d="M322 228h36M350 220l8 8-8 8" stroke="#93C5FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M358 244H322M330 252l-8-8 8-8" stroke="#F9A8D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
