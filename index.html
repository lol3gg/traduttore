<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#05070D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chatlook" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      />
    </noscript>
    <title>Chatlook</title>
    <script>
      try {
        var theme = localStorage.getItem('chatlook_theme')
        if (theme === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.classList.add('light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#F3F5FA')
        }
      } catch (e) {}
    </script>
    <script>
      /* Recover from stale PWA cache (blank screen after deploy) */
      (function () {
        var KEY = 'traduttore_sw_rescue'
        function rescue() {
          try {
            if (sessionStorage.getItem(KEY) === '1') return
            sessionStorage.setItem(KEY, '1')
          } catch (e) {}
          var done = function () {
            try {
              location.reload()
            } catch (e) {}
          }
          if (!('serviceWorker' in navigator)) {
            done()
            return
          }
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister()
                }),
              )
            })
            .then(function () {
              if (window.caches && caches.keys) {
                return caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k)
                    }),
                  )
                })
              }
            })
            .then(done)
            .catch(done)
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) rescue()
          },
          true,
        )
        window.addEventListener('unhandledrejection', function () {
          /* ignore — avoid aggressive reloads */
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
